<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b6cb0">
<title>반출 기기 통계</title>
<style>
  * { box-sizing:border-box; }
  /* 한국어는 띄어쓰기 자리에서만 줄을 넘긴다 (글자 가운데서 끊기지 않게) */
  body, body * { word-break:keep-all; overflow-wrap:break-word; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
         background:#f5f7fa; color:#222; -webkit-text-size-adjust:100%; }

  header { background:linear-gradient(135deg,#2c5282,#2b6cb0); color:#fff; padding:18px 28px;
           box-shadow:0 2px 8px rgba(0,0,0,.08); display:flex; justify-content:space-between;
           align-items:center; flex-wrap:wrap; gap:12px; }
  header h1 { margin:0; font-size:21px; font-weight:700; letter-spacing:-.3px; }
  header .sub { font-size:12.5px; opacity:.85; margin-top:3px; }
  .hdr-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .hdr-link { background:rgba(255,255,255,.18); color:#fff; text-decoration:none; padding:7px 14px;
              border-radius:5px; font-size:13px; font-weight:600; border:1px solid rgba(255,255,255,.25); }
  .hdr-link:hover { background:rgba(255,255,255,.3); }
  .updated { background:rgba(255,255,255,.15); padding:6px 14px; border-radius:5px; font-size:12px; }

  .wrap { padding:16px 28px 60px; max-width:1180px; margin:0 auto; }
  @media (max-width:640px){ header{padding:14px 16px} .wrap{padding:12px 14px 50px} header h1{font-size:18px} }

  .filters { background:#fff; padding:14px 18px; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.06);
             margin-bottom:16px; display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  .fg { display:flex; flex-direction:column; gap:4px; }
  .fg label { font-size:11.5px; color:#718096; font-weight:600; }
  .fg select { padding:6px 10px; border:1px solid #cbd5e0; border-radius:5px; font-size:13px;
               height:36px; background:#fff; font-family:inherit; min-width:120px; }
  .btn { padding:0 16px; height:36px; border:none; border-radius:5px; font-size:13px; cursor:pointer; font-family:inherit; }
  .btn.reset { background:#e2e8f0; color:#2d3748; font-weight:600; }

  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  @media (max-width:720px){ .kpis { grid-template-columns:1fr; } }
  .kpi { background:#fff; padding:14px 16px; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.06);
         border-left:4px solid #2b6cb0; }
  .kpi.red { border-left-color:#e53e3e; }
  .kpi.gray { border-left-color:#718096; }
  .kpi .l { font-size:12px; color:#718096; display:flex; align-items:center; gap:6px; }
  .kpi .v { font-size:28px; font-weight:800; letter-spacing:-1px; margin-top:2px; line-height:1.2; }
  .kpi.red .v { color:#c53030; }
  .kpi .f { font-size:11.5px; color:#a0aec0; margin-top:2px; }

  .card { background:#fff; padding:16px 18px; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:16px; }
  .card h3 { margin:0 0 3px; font-size:15px; color:#2d3748; display:flex; align-items:center; gap:8px; }
  .card .desc { font-size:12px; color:#a0aec0; margin:0 0 14px; }

  .sw { width:9px; height:9px; border-radius:2px; display:inline-block; flex:none; }
  .c-f { background:#e53e3e; } .c-s { background:#4a5568; } .c-n { background:#cbd5e0; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:#4a5568; margin-bottom:12px; }
  .legend span { display:flex; align-items:center; gap:6px; }

  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:520px; }
  th { font-size:11.5px; color:#718096; font-weight:700; text-align:right; padding:0 8px 8px;
       border-bottom:1px solid #e2e8f0; white-space:nowrap; }
  th.l { text-align:left; } th.bar { text-align:left; width:34%; }
  td { padding:8px; border-bottom:1px solid #f7fafc; text-align:right; font-variant-numeric:tabular-nums; }
  td.l { text-align:left; font-weight:600; color:#2d3748; }
  td.dim { color:#a0aec0; }
  tbody tr:hover td { background:#f7fafc; }

  .bars { display:flex; height:19px; border-radius:4px; overflow:hidden; background:#edf2f7; }
  .seg { height:100%; display:flex; align-items:center; justify-content:center;
         font-size:10.5px; font-weight:700; color:#fff; margin-right:2px; min-width:3px; }
  .seg:last-child { margin-right:0; }
  .seg.f { background:#e53e3e; } .seg.s { background:#4a5568; } .seg.n { background:#cbd5e0; color:#4a5568; }
  .seg.tiny { font-size:0; }
  tr.small .bars { opacity:.38; }

  .rate { font-weight:800; }
  .rate.hi { color:#c53030; } .rate.lo { color:#2f855a; } .rate.mid { color:#4a5568; }
  .few { font-size:10.5px; color:#a0aec0; margin-left:4px; font-weight:400; }

  .note { border-left:4px solid #2b6cb0; background:#ebf8ff; border-radius:0 6px 6px 0;
          padding:11px 14px; font-size:12.5px; color:#2c5282; margin-top:14px; line-height:1.7; }
  .note.warn { border-left-color:#e53e3e; background:#fff5f5; color:#9b2c2c; }
  .note b { font-weight:700; }

  .rule { background:#2d3748; color:#e2e8f0; border-radius:6px; padding:13px 15px;
          font-size:12.5px; line-height:1.9; }
  .rule b { color:#fc8181; } .rule i { color:#a0aec0; font-style:normal; }
  .rule .k { font-family:ui-monospace,Consolas,monospace; background:rgba(255,255,255,.08);
             padding:1px 7px; border-radius:4px; }

  .foot { font-size:11.5px; color:#a0aec0; text-align:center; margin-top:18px; line-height:1.8; }
  .loading { text-align:center; color:#a0aec0; padding:40px 10px; font-size:14px; }
  .err { background:#fff5f5; border:1.5px solid #fc8181; color:#9b2c2c; border-radius:8px;
         padding:14px 16px; font-size:13.5px; line-height:1.8; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📦 반출 기기 통계</h1>
    <div class="sub">임대 거래처에서 빠진 기기 · 「반출기기 기번 보고」 자료</div>
  </div>
  <div class="hdr-right">
    <a class="hdr-link" href="/">← 오버홀 통계로</a>
    <span class="updated" id="updated">불러오는 중…</span>
  </div>
</header>

<div class="wrap">
  <div id="body"><div class="loading">반출 기록을 불러오는 중입니다…</div></div>
</div>

<script>
var ROWS = [];          // 서버에서 받은 반출 기록 (집계용 값만 들어 있다)

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function el(id){ return document.getElementById(id); }

// ── 한 덩어리(지역/브랜드/기종/모델)의 건수를 센다
function tally(list, keyOf, labelOfEmpty) {
  var map = {};
  list.forEach(function(r){
    var k = keyOf(r) || labelOfEmpty;
    if (!map[k]) map[k] = { name:k, f:0, s:0, n:0, total:0 };
    var g = map[k];
    if (r.noReason) g.n++;
    else if (r.fault) g.f++;
    else g.s++;
    g.total++;
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}

// 고장률 — 사유를 적은 건만 모수로 센다 (빈칸을 단순으로 몰면 고장률이 낮게 나온다)
function rateOf(g){ var base = g.f + g.s; return base ? (g.f / base) : null; }
function rateHtml(g){
  var r = rateOf(g);
  if (r === null) return '<span class="dim">—</span>';
  var cls = r >= 0.45 ? 'hi' : (r <= 0.2 ? 'lo' : 'mid');
  var few = (g.f + g.s) < 5 ? '<span class="few">' + (g.f + g.s) + '건</span>' : '';
  return '<span class="rate ' + cls + '">' + Math.round(r*100) + '%' + few + '</span>';
}

function segs(g){
  function one(cls, n){
    if (!n) return '';
    var tiny = (n / g.total) < 0.07 ? ' tiny' : '';
    return '<div class="seg ' + cls + tiny + '" style="flex:' + n + '">' + n + '</div>';
  }
  var t = '고장 ' + g.f + ' · 단순 ' + g.s + (g.n ? ' · 미기재 ' + g.n : '');
  return '<div class="bars" title="' + t + '">' + one('f',g.f) + one('s',g.s) + one('n',g.n) + '</div>';
}

// ── 표 한 장
function tableHtml(groups, headLabel, opt) {
  var o = opt || {};
  groups.sort(function(a,b){
    if (o.tailNames && o.tailNames.indexOf(a.name) >= 0 && o.tailNames.indexOf(b.name) < 0) return 1;
    if (o.tailNames && o.tailNames.indexOf(b.name) >= 0 && o.tailNames.indexOf(a.name) < 0) return -1;
    if (o.byName) return a.name < b.name ? -1 : 1;
    return b.total - a.total;
  });
  if (o.limit) groups = groups.slice(0, o.limit);
  var h = '<div class="tw"><table><thead><tr><th class="l">' + headLabel + '</th><th class="bar">구성</th>'
        + '<th>고장</th><th>단순</th><th>미기재</th><th>합계</th><th>고장률</th></tr></thead><tbody>';
  groups.forEach(function(g){
    var small = (g.f + g.s) < 5;
    h += '<tr' + (small ? ' class="small"' : '') + '>'
       + '<td class="l">' + esc(g.name) + '</td>'
       + '<td>' + segs(g) + '</td>'
       + '<td' + (g.f ? '' : ' class="dim"') + '>' + g.f + '</td>'
       + '<td' + (g.s ? '' : ' class="dim"') + '>' + g.s + '</td>'
       + '<td class="dim">' + g.n + '</td>'
       + '<td>' + g.total + '</td>'
       + '<td>' + rateHtml(g) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

// 고장률이 가장 높은 줄을 한 문장으로 짚어 준다 (모수 5건 이상만)
function topNote(groups, what) {
  var cand = groups.filter(function(g){ return (g.f + g.s) >= 5; });
  if (!cand.length) return '';
  cand.sort(function(a,b){ return rateOf(b) - rateOf(a); });
  var hi = cand[0], lo = cand[cand.length - 1];
  if (rateOf(hi) === null || hi === lo) return '';
  var h = '<div class="note warn"><b>' + esc(hi.name) + '</b>이(가) ' + (hi.f + hi.s) + '건 중 '
        + hi.f + '건(' + Math.round(rateOf(hi)*100) + '%)으로 ' + what + ' 가운데 고장 비율이 가장 높습니다.';
  if (rateOf(lo) < rateOf(hi)) {
    h += ' 가장 낮은 <b>' + esc(lo.name) + '</b>은(는) ' + (lo.f + lo.s) + '건 중 ' + lo.f
       + '건(' + Math.round(rateOf(lo)*100) + '%)입니다.';
  }
  return h + '</div>';
}

// ── 필터
function current() {
  var reg = el('f-region').value, kind = el('f-kind').value, br = el('f-brand').value, ym = el('f-ym').value;
  return ROWS.filter(function(r){
    if (reg !== '전체' && r.region !== reg) return false;
    if (br !== '전체' && (r.brand || '모름') !== br) return false;
    if (ym !== '전체' && r.ym !== ym) return false;
    if (kind === '고장' && !(r.fault && !r.noReason)) return false;
    if (kind === '단순' && !(!r.fault && !r.noReason)) return false;
    if (kind === '미기재' && !r.noReason) return false;
    return true;
  });
}

function render() {
  var rows = current();
  var f = rows.filter(function(r){ return r.fault && !r.noReason; }).length;
  var n = rows.filter(function(r){ return r.noReason; }).length;
  var s = rows.length - f - n;
  var base = f + s;

  var h = '';
  h += '<div class="kpis">'
     + '<div class="kpi"><div class="l">전체 반출</div><div class="v">' + rows.length + '건</div>'
     + '<div class="f">' + (ROWS.length === rows.length ? '전체 기간' : '걸러본 결과 · 전체 ' + ROWS.length + '건') + '</div></div>'
     + '<div class="kpi red"><div class="l"><i class="sw c-f"></i>고장 반출</div><div class="v">' + f + '건</div>'
     + '<div class="f">' + (base ? '사유가 적힌 ' + base + '건 중 <b>' + Math.round(f/base*100) + '%</b>' : '—') + '</div></div>'
     + '<div class="kpi gray"><div class="l"><i class="sw c-s"></i>단순 반출</div><div class="v">' + s + '건</div>'
     + '<div class="f">계약종료 · 재계약 · 기기상향 등' + (n ? ' (사유 미기재 ' + n + '건 별도)' : '') + '</div></div>'
     + '</div>';

  var lg = '<div class="legend"><span><i class="sw c-f"></i>고장 반출</span>'
         + '<span><i class="sw c-s"></i>단순 반출</span>'
         + '<span><i class="sw c-n"></i>사유 미기재</span></div>';

  if (!rows.length) {
    h += '<div class="card"><div class="loading">고른 조건에 맞는 반출 기록이 없습니다</div></div>';
    el('result').innerHTML = h;
    return;
  }

  var gRegion = tally(rows, function(r){ return r.region; }, '미지정');
  h += '<div class="card"><h3>지역별</h3>'
     + '<p class="desc">막대는 구성 비율 · 숫자는 실제 건수 (강원도는 수도권E, 강남은 수도권C로 합쳤습니다)</p>'
     + lg + tableHtml(gRegion, '지역', { byName:true, tailNames:['미지정'] })
     + topNote(gRegion, '지역') + '</div>';

  var gBrand = tally(rows, function(r){ return r.brand; }, '모름');
  h += '<div class="card"><h3>브랜드별</h3>'
     + '<p class="desc">반출 보고에 브랜드 칸이 없어, 기기 대장의 제조사를 모델명으로 맞춰 붙였습니다 — 맞추지 못한 것은 「모름」입니다</p>'
     + lg + tableHtml(gBrand, '브랜드', { tailNames:['모름'] })
     + topNote(gBrand.filter(function(g){ return g.name !== '모름'; }), '브랜드') + '</div>';

  var gCat = tally(rows, function(r){ return r.category; }, '미분류');
  h += '<div class="card"><h3>기종별</h3>'
     + '<p class="desc">보고의 「분류」 칸 · 칼러/컬러처럼 다르게 적힌 것은 하나로 묶었습니다</p>'
     + lg + tableHtml(gCat, '기종', { tailNames:['미분류'] })
     + topNote(gCat.filter(function(g){ return g.name !== '미분류'; }), '기종') + '</div>';

  var gModel = tally(rows, function(r){ return r.model; }, '모델명 미기재');
  h += '<div class="card"><h3>모델별 <span style="font-size:12px;font-weight:400;color:#a0aec0">많이 들어온 10종</span></h3>'
     + '<p class="desc">적힌 그대로 셉니다 — 같은 기계를 다르게 적은 것은 아직 묶지 않았습니다</p>'
     + tableHtml(gModel, '모델', { limit:10 }) + '</div>';

  h += '<div class="card"><h3>구분은 이렇게 가릅니다</h3>'
     + '<p class="desc">반출 사유에 적힌 글자를 보고 자동으로 나눕니다 — 사람이 다시 고를 필요가 없습니다</p>'
     + '<div class="rule">'
     + '<b>고장 반출</b> <i>← 사유에</i> <span class="k">기기고장</span> <i>이 들어간 건</i><br>'
     + '&nbsp;&nbsp;&nbsp;예: 기기고장 : 화면먹통 · 기기고장, 상향 : 사용량 많음<br><br>'
     + '<span style="color:#cbd5e0">단순 반출</span> <i>← 그 밖에 사유가 적힌 건</i><br>'
     + '&nbsp;&nbsp;&nbsp;계약종료 · 계약기간내해지 · 재계약 · 현장/단기종료 · 기기상향 · 여분교체<br><br>'
     + '<span style="color:#a0aec0">사유 미기재</span> <i>← 사유 칸이 비어 있는 건</i>'
     + '</div>'
     + '<div class="note">사유를 적지 않은 건은 <b>단순 반출로 몰지 않고 따로 셉니다.</b> '
     + '고장률도 사유가 적힌 건만 모수로 잡습니다 — 빈칸을 단순으로 치면 고장률이 실제보다 낮게 나옵니다.</div></div>';

  el('result').innerHTML = h;
}

function buildFilters() {
  var regions = {}, brands = {}, yms = {};
  ROWS.forEach(function(r){ regions[r.region]=1; brands[r.brand||'모름']=1; if(r.ym) yms[r.ym]=1; });
  function opts(obj, tail) {
    var ks = Object.keys(obj).sort();
    if (tail) { ks = ks.filter(function(k){ return k !== tail; }); ks.push(tail); }
    return '<option>전체</option>' + ks.map(function(k){ return '<option>' + esc(k) + '</option>'; }).join('');
  }
  var ymList = Object.keys(yms).sort().reverse();
  return '<div class="filters">'
    + '<div class="fg"><label>기간</label><select id="f-ym"><option>전체</option>'
    + ymList.map(function(k){ return '<option value="' + k + '">' + k.replace('-','년 ') + '월</option>'; }).join('')
    + '</select></div>'
    + '<div class="fg"><label>지역</label><select id="f-region">' + opts(regions, '미지정') + '</select></div>'
    + '<div class="fg"><label>구분</label><select id="f-kind">'
    + '<option>전체</option><option>고장</option><option>단순</option><option>미기재</option></select></div>'
    + '<div class="fg"><label>브랜드</label><select id="f-brand">' + opts(brands, '모름') + '</select></div>'
    + '<button class="btn reset" id="f-reset">초기화</button>'
    + '</div><div id="result"></div>';
}

function start() {
  fetch('/api/withdrawal-stats')
    .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
    .then(function(x){
      if (!x.ok || !x.j || !x.j.ok) {
        el('body').innerHTML = '<div class="err"><b>반출 기록을 불러오지 못했습니다.</b><br>'
          + esc((x.j && x.j.error) || '잠시 뒤 다시 열어 주세요.') + '</div>';
        el('updated').textContent = '불러오기 실패';
        return;
      }
      ROWS = x.j.rows || [];
      el('body').innerHTML = buildFilters();
      ['f-ym','f-region','f-kind','f-brand'].forEach(function(id){ el(id).onchange = render; });
      el('f-reset').onclick = function(){
        el('f-ym').value='전체'; el('f-region').value='전체'; el('f-kind').value='전체'; el('f-brand').value='전체';
        render();
      };
      var d = new Date();
      var p = function(n){ return (n<10?'0':'') + n; };
      el('updated').textContent = '갱신 ' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
      render();
    })
    .catch(function(e){
      el('body').innerHTML = '<div class="err"><b>반출 기록을 불러오지 못했습니다.</b><br>' + esc(e.message||e) + '</div>';
      el('updated').textContent = '불러오기 실패';
    });
}
start();
</script>

<div class="wrap" style="padding-top:0">
  <p class="foot">
    막대에 마우스를 올리면 건수가 뜹니다 · 사유가 적힌 건이 5건 미만인 줄은 막대를 흐리게 하고 비율 옆에 건수를 붙였습니다<br>
    자료 출처 — 백오피스 「반출기기 기번 보고」
  </p>
</div>

</body>
</html>
