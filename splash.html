<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#2b6cb0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오버홀입력">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>오버홀 관리 시스템</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #fcf9f7;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer;
  }
  .splash { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .splash img {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain; display: block;
    opacity: 0; transition: opacity .45s ease;
  }
  .splash img.on { opacity: 1; }

  /* 화면 맨 아래 실제 진행 바 (이미지와 별개) */
  .bar { position: fixed; left: 0; bottom: 0; width: 100%; height: 4px; background: rgba(0,0,0,0.07); }
  .bar > span { display: block; height: 100%; width: 0; background: #14504b; transition: width .25s linear; }

  .skip {
    position: fixed; right: 14px; bottom: 16px;
    font-size: 12px; color: #14504b; opacity: 0.55;
    background: rgba(255,255,255,0.75); border-radius: 14px; padding: 5px 12px;
  }
</style>
</head>
<body>

<div class="splash"><img id="art" src="splash.jpg" alt="오버홀 관리 시스템"></div>
<div class="bar"><span id="prog"></span></div>
<div class="skip">화면을 누르면 바로 시작</div>

<script>
var NEXT = 'form.html';
var HOLD = 2600;      // 로딩 화면 노출 시간 (ms)
var moved = false;

function go() {
  if (moved) return;
  moved = true;
  location.replace(NEXT);
}

// 이미지 준비되면 페이드 인
var art = document.getElementById('art');
function showArt() { art.classList.add('on'); }
if (art.complete) showArt(); else { art.onload = showArt; art.onerror = showArt; }

// 진행 바 채우기
var prog = document.getElementById('prog');
var started = null;
function tick(ts) {
  if (started === null) started = ts;
  var p = Math.min(1, (ts - started) / HOLD);
  prog.style.width = (p * 100).toFixed(1) + '%';
  if (p < 1) requestAnimationFrame(tick); else go();
}
requestAnimationFrame(tick);

// 탭하면 즉시 넘어가기
document.addEventListener('click', go);
document.addEventListener('touchstart', go, { passive: true });

// 입력폼 미리 받아두기 (넘어갈 때 즉시 뜨도록)
try { fetch(NEXT, { cache: 'reload' }).catch(function(){}); } catch (e) {}

// PWA 서비스워커 등록
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>

</body>
</html>
