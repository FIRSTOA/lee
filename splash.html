<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#2b6cb0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오버홀입력">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>오버홀 관리 시스템</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #fcf9f7;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer;
  }
  .splash { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  /* 이미지 크기에 딱 맞는 무대 (게이지를 그림 위 정확한 자리에 올리기 위함)
     stage 의 font-size 는 JS 가 '이미지 너비의 1%' 로 맞춤 → 1em = 이미지 너비 1% */
  .stage { position: relative; line-height: 0; font-size: 9px; }
  .stage img {
    max-width: 100vw; max-height: 100vh;
    width: auto; height: auto;
    display: block;
    opacity: 0; transition: opacity .45s ease;
  }
  .stage img.on { opacity: 1; }
  .stage .live { opacity: 0; transition: opacity .45s ease; }
  .stage img.on ~ .live { opacity: 1; }

  /* 그림 아래쪽 빈 바닥 위에 LOADING · 게이지 · % · 안내문을 직접 그림 */
  .loadlabel {
    position: absolute; left: 0; right: 0; top: 84.3%; text-align: center;
  }
  .loadlabel > span {
    display: inline-block;
    font-size: 2.6em; font-weight: 700; line-height: 1.1;
    letter-spacing: 0.5em; text-indent: 0.5em;
    color: #0f4340;
  }

  .gauge {
    position: absolute; left: 23.67%; top: 88.0%;
    width: 55.44%; height: 2.44em;
    background: #cfc9c2; border-radius: 999px; overflow: hidden;
  }
  .gauge > span {
    display: block; height: 100%; width: 0;
    background: #063c3a; border-radius: 999px;
  }

  .pct { position: absolute; left: 0; right: 0; top: 90.3%; text-align: center; }
  .pct > span {
    display: inline-block;
    font-size: 3.8em; font-weight: 700; line-height: 1.1;
    color: #0f4340;
    font-variant-numeric: tabular-nums;
  }

  .hint { position: absolute; left: 0; right: 0; top: 94.3%; text-align: center; }
  .hint > span {
    display: inline-block;
    font-size: 1.9em; font-weight: 500; line-height: 1.2;
    color: #4a5c59;
  }

  .skip {
    position: fixed; right: 14px; bottom: 16px;
    font-size: 12px; color: #14504b; opacity: 0.55;
    background: rgba(255,255,255,0.75); border-radius: 14px; padding: 5px 12px;
  }
</style>
</head>
<body>

<div class="splash">
  <div class="stage" id="stage">
    <img id="art" src="splash.jpg" alt="오버홀 관리 시스템">
    <div class="live">
      <div class="loadlabel"><span>LOADING...</span></div>
      <div class="gauge"><span id="prog"></span></div>
      <div class="pct"><span id="pctText">0%</span></div>
      <div class="hint"><span>잠시만 기다려 주세요.</span></div>
    </div>
  </div>
</div>
<div class="skip">화면을 누르면 바로 시작</div>

<script>
var NEXT = 'form.html';
var HOLD = 2600;      // 로딩 화면 노출 시간 (ms)
var moved = false;

function go() {
  if (moved) return;
  moved = true;
  location.replace(NEXT);
}

var art = document.getElementById('art');
var stage = document.getElementById('stage');
var prog = document.getElementById('prog');
var pctText = document.getElementById('pctText');

// 게이지/숫자 크기를 이미지 실제 너비에 맞춤 (1em = 이미지 너비의 1%)
function fitScale() {
  var w = art.clientWidth || art.naturalWidth || 900;
  stage.style.fontSize = (w / 100) + 'px';
}

// 이미지 준비되면 페이드 인
function showArt() { fitScale(); art.classList.add('on'); }
if (art.complete) showArt(); else { art.onload = showArt; art.onerror = showArt; }
window.addEventListener('resize', fitScale);
window.addEventListener('orientationchange', fitScale);

// 진행 바 0% → 100% 채우기 (숫자도 같이 올라감)
var started = null;
function tick(ts) {
  if (started === null) started = ts;
  var p = Math.min(1, (ts - started) / HOLD);
  prog.style.width = (p * 100).toFixed(1) + '%';
  pctText.textContent = Math.round(p * 100) + '%';
  if (p < 1) requestAnimationFrame(tick); else go();
}
requestAnimationFrame(tick);

// 탭하면 즉시 넘어가기
document.addEventListener('click', go);
document.addEventListener('touchstart', go, { passive: true });

// 입력폼 미리 받아두기 (넘어갈 때 즉시 뜨도록)
try { fetch(NEXT, { cache: 'reload' }).catch(function(){}); } catch (e) {}

// PWA 서비스워커 등록
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>

</body>
</html>
